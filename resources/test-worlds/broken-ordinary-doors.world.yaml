# #314 demo: two alternatives and a remote observer who discovers the failure locally.
version: 33
name: Ordinary Doors - Broken and remembered condition
randomSeed: 0
cellsWide: 12
levelsHigh: 2
layers: 3
layerNames: [Front, Back, Remote approach]
construction:
  - {type: room, name: Front hall, layer: 0, y: 0, x: 0, cellsWide: 11, levelsHigh: 1, topLevelHeight: 0.9}
  - {type: room, name: Back hall, layer: 1, y: 0, x: 0, cellsWide: 11, levelsHigh: 1, topLevelHeight: 0.9}
  - {type: room, name: Remote hall, layer: 2, y: 0, x: 0, cellsWide: 11, levelsHigh: 1, topLevelHeight: 0.9}
  - type: door
    layer: 0
    y: 0
    x: 2
    width: 1
    height: regular
    foreControl: false
    backControl: false
    activationMode: manual
    holdOpenSeconds: 5
    crossingLanes: 0
    openStyle: openApart
    initiallyBroken: true
  - type: door
    layer: 0
    y: 0
    x: 8
    width: 1
    height: regular
    foreControl: true
    backControl: true
    activationMode: remoteControlled
    holdOpenSeconds: 5
    crossingLanes: 0
    openStyle: openLeft
  - type: door
    layer: 1
    y: 0
    x: 5
    width: 1
    height: regular
    foreControl: false
    backControl: false
    activationMode: automatic
    holdOpenSeconds: 5
    crossingLanes: 0
    openStyle: openUp
  - {type: marker, sectorIndex: 0, levelIndex: 0, xOffset: 0.5, id: 1, name: Front destination, properties: 0}
  - {type: marker, sectorIndex: 1, levelIndex: 0, xOffset: 0.5, id: 2, name: Back destination, properties: 0}
nextMarkerId: 3
nextAgentGroupId: 1
agentGroups: []
agents:
  - id: 1
    agent: {name: Local observer, flags: 0}
    sector: 0
    localX: 0.5
    localY: 0
    path: {destinationSector: 1, destinationLocalX: 0.5, destinationLocalY: 0, active: true}
  - id: 2
    agent: {name: Remote observer, flags: 0}
    sector: 2
    localX: 0.5
    localY: 0
    path: {destinationSector: 0, destinationLocalX: 0.5, destinationLocalY: 0, active: true}

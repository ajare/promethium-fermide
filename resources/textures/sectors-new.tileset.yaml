    hole: [13, 160, 102, 160]
  doorframe-corridor-2r-L0:
    cell: [11, 2]
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
    tintable: true
    # The left cell of a 1.8 x 0.5 aperture: u[0.1,1.0].
    hole: [13, 160, 115, 160]

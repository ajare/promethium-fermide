# Authored tileset for the SectorAtlas set (#1017, variant families #1038).
#
# A version 2 tileset declares, per tile, the two render semantics a
# version 1 file left the renderer to guess: the render offset it draws at
# and the drawn size it draws at. Offsets and sizes
# are World units, not pixels - one World unit of authored art is one
# authored tile.
#
# What a tile looks like is not among them, because there is nothing to
# declare: a tile draws as its artwork paints it. No colour is multiplied
# into a tile on the way to the screen, so a picture that has to be darker,
# lighter or another hue is another picture, authored as one.
#
# The `ImageSet` entries the application manifest declares for this atlas
# are generated from this file by `scripts/generate_sector_atlas_new.py`
# and are checked against it by the render smoke module, so the two cannot
# drift. Pixel regions are cut from `image` in top-left-origin pixels; the
# semantics below are World units and never pixels.
#
# The authored grid is 128 x 320: one World cell at the size the World is
# now drawn. Every Infrastructure tile fills its cell, so a Sector one cell
# wide covers exactly one cell and a Sector four cells wide covers four.
#
# ## What this set is
#
# Infrastructure: the static World fabric, as one full-cell artwork per
# Sector surface. Twelve base tiles, one for each of the twelve
# surface-bearing Sector types - Room, Corridor, Ladder, Lift, Shuttle,
# Stairwell, Staircase, Airlock, Chamber, Dumbwaiter, Background and
# Facade. Each repeats once per World
# cell across the Sector's area, anchored on the Sector's floor line,
# cropping partial cells rather than stretching a whole tile to a
# Corridor's height. A short Sector keeps the tile's floor end on its own
# floor at one artwork pixel to one screen pixel and drops the top band
# that would have stood above its ceiling.
#
# Two of these surfaces become live that were declared in the old manifest
# but never drawn. The Shuttle and the Staircase used to borrow the Lift and
# Stairwell tiles because their distinguishing art is procedural - the
# Shuttle's carriage and the Staircase's steps - and a fixed tile was said
# to fight it underneath. It does not: the procedural geometry renders on
# top of the Sector surface either way, and now it renders on the type's own
# art instead of over a borrowed shaft.
#
# Background and Facade are in the set on the same terms as every wall.
# Their surface is artwork this sheet carries, not a colour the renderer
# mixes: they used to be filled with a colour packed from the Sector's own
# authored triple, which made their look a rendering rule rather than a
# picture an artist could draw. They ask for a tile like any other type
# does, and what they get is whatever is drawn in their cell here. What they
# do not declare is a variant family - one picture each, no second one to
# pick - which is why a variant recorded on either is still refused. A
# Facade asks this set for one thing besides, and it is an overlay rather
# than a surface: the doorframe over the cells a Door stands in - and it is
# the same frame a Room or a Corridor wears, because a frame laid over a wall
# says nothing about which wall it lies over (#1073).
#
# ## Variant families
#
# Each base sprite declares `variants: N`, and the family beneath it is
# derived rather than authored. Variant *n* is named `<base>-Vn` and sits in
# the base's own column one row below the tile above it, so `-V1` is
# directly beneath the base and `-VN` is N rows down. It inherits the base's
# content rectangle, render offset and drawn size: adding a
# variant is a picture decision and never a re-declaration of geometry.
#
#     corridor:            # cell [1, 0]
#       variants: 3        # -> corridor-V1 [1, 1], corridor-V2 [1, 2],
#                        #    corridor-V3 [1, 3]
#
# The base keeps its bare name and stays variant 0, so every tile name that
# existed before variants still means what it meant. The `-V` prefix keeps
# these clear of the `-L0`/`-M0`/`-XY` role vocabulary the Furniture set uses
# (#1013). A count is the only thing an author states about a family; the
# names and the cells come from the rule, so neither can be written wrong.
#
# The key belongs on a base sprite and nowhere else. A `variants` key on the
# file itself is refused, and so is one on a derived variant - a family
# under a family has no layout to live in. The object-shaped atlases take
# the key on the same terms since #1053: the derivation is one shared rule
# the two formats read through the same grid loader, not one copy apiece.
# What still refuses it is the version 1 formats, each for the reason its
# own shape gives - the sector's v1 surfaces are bare rectangles with no
# cell to descend from, and the object's v1 tiles author no render
# semantics for a variant to inherit.
#
# A count that would run past the bottom of the declared sheet is refused at
# load. A column that walks off the sheet is a miscount, and drawing nothing
# for it is a silent failure where a refusal is a loud one.
#
# Authored at three variants for the ten wall types that have them, the
# twelve base tiles sit as a single 12 x 1 strip across the top - the type
# list reading in one pass
# instead of wrapping mid-list as the old 5 x 2 grid did - with three
# variant rows descending beneath each of the ten that declare a family.
# The Background and the Facade stand at the end of the strip with no
# variant rows of their own. The doorframe block (#1054,
# #1073) and the windowframe block (#1075) stand to the right of that
# strip, so the sheet is 2432 x 1280: nineteen columns of the same 128 x
# 320 grid, the last seven of them overlays. Four rows deep - the base
# strip and its three variant rows - because neither frame needs a row per
# wall: six doorframes, two rows in the three doorframe columns, and the
# two cells below them stay empty, and the windowframes take the four
# fresh columns as the role grid itself, described below.
#
# ## Windowframe overlays
#
# A windowframe is the moulding laid **over** the wall's own tile around
# the opening a Window stands in, with a transparent hole for the glass
# and the space behind to show through. It is derived from the live
# Window and never painted, and it is drawn last - over the wall's tile,
# over the space behind and over the glass - so the moulding is what
# reads as the edge of the opening (#1075).
#
# The frame is keyed by one thing only: where its cell sits in the
# opening's span. That is two axes, each with a small fixed set of
# answers, and the grid closes at fifteen tiles:
#
#     windowframe-<vertical role><horizontal role>
#
# | | `S` single column | `L` leftmost | `M` middle column | `R` rightmost |
# | --- | --- | --- | --- | --- |
# | **`S` single level** | hole band | left jamb + band | left edge band | right jamb + band |
# | **`T` top of a taller span** | head + jambs | head + left jamb | head only | head + right jamb |
# | **`M` middle level** | jambs only | left jamb | *no tile asked for* | right jamb |
# | **`B` bottom of a taller span** | sill + jambs | sill + left jamb | sill only | sill + right jamb |
#
# The block on the sheet *is* that grid. Columns left to right are the
# horizontal role `S L M R`; rows top to bottom are single-level, top
# cell, middle cell, bottom cell, so the bottom-of-window tiles carry the
# highest y and sit lowest on the sheet the way they sit lowest in the
# window. The all-middle cell of the block is left empty because no tile
# is asked for there: the middle of a span that is middle in both
# directions is all glass with no moulding at all.
#
# The Furniture role vocabulary cannot carry this, and that is deliberate.
# That convention is `<piece>-<role><level>`, where the trailing digit is
# the height level *within the footprint*. A windowframe's vertical role
# is end-versus-middle, not a level index: the bottom cell of a one-level
# window needs a hole band and the bottom cell of a three-level window
# needs a hole running to the cell top, and both are level 0. And
# `L`/`M`/`R` has no "inset on both sides" case - a one-column window's
# cell is inset on both of its edges, which is different art from a
# two-column window's left cell. Forcing the shape would make one
# convention mean two different things in two different files.
#
# The set carries one tile of that grid so far, `windowframe-SS`, the
# single-column single-level cell: the 1x1 window, which is eight of the
# ten windows every bundled document authors. The rest of the grid
# arrives with the wide, tall and corner work that hangs off it; a cell
# whose frame the installed atlas does not carry draws nothing, exactly
# as it does for a missing doorframe, so the block can be filled one
# tile at a time and no World ever draws a hole where a frame has not
# been drawn yet.
#
# The hole is rounded down from the glass rect the frame frames - the
# same rule the doorframes use, for the same reason. A Window's glass is
# inset 0.1 at each end of its span, stands 0.2 above the span's floor
# line and is 0.3 of a level tall, all of it constant per role however
# big the span gets. On a 128 x 320 cell that rounds down to x 13, width
# 102, y 160, height 96 - inset inward on every edge, so the moulding
# never stands inside the pane.
#
# ## Doorframe overlays
#
# A frame is the moulding around a doorway, laid **over** the wall's own
# tile rather than traded for it. The wall's tile is drawn across the door
# cells as it is across every other cell of that wall; the frame goes over
# it, over the space behind that shows through the opening, and over the
# leaves. Its hole is transparent and its moulding is not, which is the
# whole of what a frame has to be (#1073).
#
# Because the wall's look comes from the wall's tile, the frame does not
# vary with the wall. Six tiles cover every opening in every wall type:
#
#     doorframe-<width><height>-<role>
#
# the width is 1 or 2 cells, the height is `r`egular or `t`all, and the
# role is `L0` for the opening's left cell and `R0` for its right. A
# 1-wide opening has only an `L0`.
#
# They used to be fifteen. `doorframe-room-*`, `doorframe-corridor-*` and
# `doorframe-facade-*` each carried their wall's appearance, because the
# frame *was* the door cell's surface and so had to be the wall as well as
# the moulding - and since the moulding was identical in all three, that
# was three copies of six tiles drawn to differ in a way nothing could
# see. Dropping the wall from the key is what the frame lying over the
# wall makes possible, and it is most of why this rendering exists.
#
# Frames are derived from the live Door and are never painted by an author,
# so they sit in a sibling `overlays` map rather than in `surfaces`. That
# keeps `hasSectorTileSurface()` answering the question its name asks - is
# this a Sector surface - and a doorframe is not one. The per-cell surface
# loop can still draw one: a resolved name that is not a surface is looked
# up among the overlays before the cell falls back to the missing-art colour.
#
# Every frame declares a `hole`: the transparent opening it frames, in
# image pixels from its own cell's top-left. The generator punches it, so
# the placeholder sheet shows the frame's shape rather than a solid slab,
# and the hole the artwork actually has is the one this file states.
#
# The hole is rounded *down* from the aperture it frames - inset inward on
# every edge, never outward. A 0.8-wide aperture on a 128-pixel cell is
# 102.4 pixels; the hole is 102. The leaf is clipped to the aperture, so
# rounding down costs at most a fraction of a pixel of moulding covered by
# the leaf. Rounding up would put the moulding inside the doorway, which
# reads as an opening smaller than the hole it was cut for. The hole
# reaches the cell's bottom edge because the aperture does: there is no
# sill in this geometry.
#
# ## No boundary strips
#
# The old set's four boundary regions - the ceiling, floor and side wall
# strips - are dropped. A version 2 sector tileset has no `boundaries` map
# at all, and the loader refuses one that declares it. Every Sector edge
# therefore takes the renderer's primitive line fallback. That is an artwork
# removal only: the wall-span calculation, the partial-height opening
# handling and the floor-and-ceiling-at-bounds-only rule are unchanged, and
# the checks that prove them still pass.
#
# ## Why every tile is one full cell at the anchor
#
# A Sector surface repeats on a fixed per-cell grid: one tile per World cell,
# magnified to the World cell's screen size. A tile drawn at another size,
# or offset off its cell's anchor, would repeat on a geometry the per-cell
# rule cannot express, so the loader refuses both. Art that does not fill its
# cell is legal - it gets transparent padding - but it is drawn at the full
# cell.
#
# A tile's look is its artwork and nothing else. There is no per-tint flag
# here because there is no tint: the renderer multiplies no colour into a
# tile on the way to the screen, so what is drawn in a cell here is what
# draws on screen.
version: 2
image: sectors-new.png
size: [2432, 1280]
tile_size: [128, 320]
sprites:
  # One row across the top: the two Locations, the three vertical transits,
  # the two stair types, the three enclosed transits, then the two flat
  # surfaces. Each owns the column beneath it, and each of the first ten
  # declares the same three variants.
  room:
    cell: [0, 0]
    variants: 3
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
  corridor:
    cell: [1, 0]
    variants: 3
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
  ladder:
    cell: [2, 0]
    variants: 3
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
  lift:
    cell: [3, 0]
    variants: 3
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
  shuttle:
    cell: [4, 0]
    variants: 3
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
  stairwell:
    cell: [5, 0]
    variants: 3
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
  staircase:
    cell: [6, 0]
    variants: 3
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
  airlock:
    cell: [7, 0]
    variants: 3
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
  chamber:
    cell: [8, 0]
    variants: 3
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
  dumbwaiter:
    cell: [9, 0]
    variants: 3
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
  # The two flat surfaces. They declare no `variants`: one picture each,
  # and no second one for an author to pick. Their cells are the whole of
  # what a Background and a Facade look like - the renderer adds no colour
  # of its own to either.
  background:
    cell: [10, 0]
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
  facade:
    cell: [11, 0]
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]

overlays:
  # The six frames, in the three columns to the right of the surface
  # strip: the regular row of them on top, the tall row beneath. Each
  # `hole` is the aperture it frames, rounded down into whole pixels of
  # the 128 x 320 cell and measured from that cell's top-left; the
  # aperture in World units is written beside each one. A frame declares
  # no `variants`: it is derived from the opening it frames and there is
  # no second picture of it to pick.
  doorframe-1r-L0:
    cell: [12, 0]
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
    # u[0.1,0.9] v[0,0.5] - a 0.8 x 0.5 aperture.
    hole: [13, 160, 102, 160]
  doorframe-2r-L0:
    cell: [13, 0]
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
    # The left cell of a 1.8 x 0.5 aperture: u[0.1,1.0].
    hole: [13, 160, 115, 160]
  doorframe-2r-R0:
    cell: [14, 0]
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
    # The right cell of a 1.8 x 0.5 aperture: u[0.0,0.9].
    hole: [0, 160, 115, 160]
  doorframe-1t-L0:
    cell: [12, 1]
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
    # u[0.1,0.9] v[0,0.9] - a 0.8 x 0.9 aperture.
    hole: [13, 32, 102, 288]
  doorframe-2t-L0:
    cell: [13, 1]
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
    # The left cell of a 1.8 x 0.9 aperture: u[0.1,1.0].
    hole: [13, 32, 115, 288]
  doorframe-2t-R0:
    cell: [14, 1]
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
    # The right cell of a 1.8 x 0.9 aperture: u[0.0,0.9].
    hole: [0, 32, 115, 288]

  # The windowframe block, in the four fresh columns to the right of the
  # doorframes, laid out as the role grid itself: columns left to right
  # are the horizontal role `S L M R`, rows top to bottom are
  # single-level, top cell, middle cell, bottom cell. A tile's place in
  # the block is the place its cell holds in the opening it frames, so an
  # artist reads the grid off the sheet. Only the `S` column is filled so
  # far; the other three columns are the grid's shape, waiting for the
  # wide, tall and corner work, and a cell asking for a tile the sheet
  # does not carry draws no frame rather than a hole.
  windowframe-SS:
    # The block's single-column, single-level cell: the 1x1 Window.
    cell: [15, 0]
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
    # The glass rect a 1x1 Window frames - u[0.1,0.9], v[0.2,0.5] above
    # the cell's floor line - rounded down inward on every edge.
    hole: [13, 160, 102, 96]

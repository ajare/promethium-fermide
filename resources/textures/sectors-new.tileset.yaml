overlays:
  # The doorframes, in the three columns to the right of the surface strip.
  # Regular frames on the top row of the block, tall frames beneath them,
  # the Corridor's three under the Room's six. Each `hole` is the aperture
  # it frames, rounded down into whole pixels of the 128 x 320 cell and
  # measured from that cell's top-left; the aperture in World units is
  # written beside each one. A frame declares no `variants`: it is derived
  # from the wall it frames and there is no second picture of it to pick.
  doorframe-room-1r-L0:
    cell: [10, 0]
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
    tintable: true
    # u[0.1,0.9] v[0,0.5] - a 0.8 x 0.5 aperture.
    hole: [13, 160, 102, 160]
  doorframe-room-2r-L0:
    cell: [11, 0]
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
    tintable: true
    # The left cell of a 1.8 x 0.5 aperture: u[0.1,1.0].
    hole: [13, 160, 115, 160]
  doorframe-room-2r-R0:
    cell: [12, 0]
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
    tintable: true
    # The right cell of a 1.8 x 0.5 aperture: u[0.0,0.9].
    hole: [0, 160, 115, 160]
  doorframe-room-1t-L0:
    cell: [10, 1]
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
    tintable: true
    # u[0.1,0.9] v[0,0.9] - a 0.8 x 0.9 aperture.
    hole: [13, 32, 102, 288]
  doorframe-room-2t-L0:
    cell: [11, 1]
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
    tintable: true
    # The left cell of a 1.8 x 0.9 aperture: u[0.1,1.0].
    hole: [13, 32, 115, 288]
  doorframe-room-2t-R0:
    cell: [12, 1]
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]

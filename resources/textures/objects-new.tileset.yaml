# Authored tileset for the ObjectAtlas set (#1014).
#
# A version 2 tileset declares, per tile, the three render semantics a
# version 1 file left the renderer to guess: the render offset it draws at,
# the drawn size it draws at, and whether it is tintable. Offsets and sizes
# are World units, not pixels - one World unit of authored art is one
# authored tile.
#
# The `ImageSet` entries the application manifest declares for this atlas
# are generated from this file by `scripts/generate_object_atlas_new.py`
# and are checked against it by the render smoke module, so the two cannot
# drift. Pixel regions are cut from `image` in top-left-origin pixels; the
# semantics below are World units and never pixels.
#
# The authored grid is 128 x 320: one World cell at the size the World is
# now drawn. The Walkway was the tracer-bullet entry; the Bulkhead Door and
# the Access panel are live here too (#1019); #1020 lands the Door, the
# three Window styles, the Booth Window's frame and shutter, the two Button
# states and the Marker; and the vehicles - the Lift car, the Platform lift
# and the Shuttle carriage - arrive on the same sheet (#1021).
#
# The vehicles are what took the sheet to a fourth row. They arrived when
# the set held nineteen tiles, and two tiles crammed into one cell would
# break the one promise the grid makes to whoever draws the real art: that
# a tile owns its whole 128 x 320 slot. So the image grew by a row rather
# than a cell being shared, and the row stays. #1031 dropped the Booth
# Window's closed panel - the Objects contract required it and no draw call
# named it - which leaves one cell free. Pulling the last tile up into it
# would move every other tile's pixels to buy nothing, and the sheet is
# sized for the art that has not landed yet.
#
# #1056 replaced the bare `door` tile with the `door-L0` and `door-R0`
# leaf families, which is why the sheet is eight columns wide. A leaf
# family owns its whole column for all four rows, because `-Vn` derives at
# `baseRow + n`: L0 sits at [6,0] with its variants at [6,1..3], R0 at
# [7,0] with its own beneath. The old `door` cell at [3,0] is left empty
# rather than backfilled, for the same reason the free cell above is.
#
# #1057 added the Lift and Shuttle leaf families beside the ordinary
# pair, which is why the sheet is eleven columns wide. They are leaves of
# the same shape - full cell, one drawn size, translated under the same
# aperture clip - so each takes a column the same way, and the three of
# them land in columns 8, 9 and 10 rather than being interleaved with the
# tiles that got there first.
#
# Every content rectangle below is the tile's declared drawn size measured
# at the authored grid's pixel size, rounded to whole pixels: a tile drawn
# 0.8 x 0.5 World units is 102 x 160 px on this 128 x 320 grid. That keeps
# the art and its declared extent in the same proportion, so nothing is
# stretched on its way to the screen.
version: 2
image: objects-new.png
size: [1408, 1280]
tile_size: [128, 320]
sprites:
  # A Walkway is `Object(cellX, cellY, 1.0, 0.0)`: deliberately zero
  # physical height, so it never obstructs pathing, routing or support.
  # Its visible slab belongs to the artwork. The tile is 24px tall; drawn
  # at 0.075 World units - 24 of a 320px Level - it hangs that far below
  # the floor line of the cell it was authored in, with -y pointing down
  # from the anchor at the cell's bottom-left.
  walkway:
    cell: [0, 0]
    content: [0, 0, 128, 24]
    offset: [0.0, -0.075]
    drawn_size: [1.0, 0.075]
    tintable: true

  # A Bulkhead Door is a solid physical slab straddling the boundary
  # between two adjacent Locations. Its geometry puts it 0.1 into one cell
  # and 0.1 into the next - `cellX + 0.9` to `cellX + 1.1` - so the
  # artwork crosses that boundary exactly where the collision does. It is
  # drawn at its own 0.2 x 0.7 aspect ratio, not the cell's 2:5: the
  # declared drawn size is the slab, and the cell has no claim on it.
  # Content is 26 x 224px, the slab at the authored grid's pixel size.
  #
  # The slab opens vertically from the floor, so what is visible is what
  # is still down. The renderer crops the artwork's bottom by the live
  # open state and draws the rest at the top of the extent, which is what
  # keeps a door half open showing exactly half open rather than tracking
  # a frame counter.
  bulkhead-door:
    cell: [1, 0]
    content: [0, 0, 26, 224]
    offset: [0.0, 0.0]
    drawn_size: [0.2, 0.7]
    tintable: true

  # An Access panel is a cell-owned object drawn on the visible back
  # surface of a Room, Corridor or Facade. Its geometry - width, height
  # and the bottom offset it sits above the cell floor - is authored per
  # panel (`AccessPanelGeometry`), so the panel's own rect is what the
  # artwork is drawn into; the declared drawn size here is the reference
  # the art is authored at, which is the default geometry of 0.5 x 0.25 -
  # 64 x 80px on this grid. The leaf retracts into the top edge as it
  # opens, and the renderer crops the artwork to follow it.
  access-panel:
    cell: [2, 0]
    content: [0, 0, 64, 80]
    offset: [0.0, 0.0]
    drawn_size: [0.5, 0.25]
    tintable: true

  # A Door leaf is a full-cell tile. The artwork fills the whole 128 x 320
  # cell, the renderer draws it at the cell rect, translates it by the
  # opening animation and clips it to the doorway aperture. The clip is the
  # doorway, so a leaf cannot paint outside it, and one tile serves both
  # widths: a 1-wide Door sees L0 across u[0.1,0.9], a 2-wide Door sees
  # the same L0 across u[0.1,1.0]. The clip selects the band, so the art
  # never needs a width-specific variant.
  #
  # Every leaf tile declares the same drawn size and a zero render offset -
  # one contract value for the whole family rather than one per width and
  # height. This replaces the old bare `door` tile, which declared the
  # 0.8 x 0.5 aperture as its drawn size and was cropped from its own edge
  # to animate (#1056).
  #
  # ART CONSTRAINT NOTHING CAN VALIDATE: a 1-wide OpenApart Door splits
  # this single tile at the cell centre and wears both halves, so the
  # artwork must be symmetric about u = 0.5. An asymmetric panel reads as
  # two mismatched leaves and no loader can catch it.
  door-L0:
    cell: [6, 0]
    variants: 3
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
    tintable: false

  # The right-hand leaf of a 2-wide Door: the right half of one joined
  # two-cell leaf. Same contract as door-L0.
  door-R0:
    cell: [7, 0]
    variants: 3
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
    tintable: false

  # The Lift landing's own leaves (#1057). A Lift landing Door draws
  # these rather than the ordinary pair because the Lift owns it, which is
  # what makes a lift read as a lift at a glance. The wall it happens to
  # be set in - Room, Corridor or Facade - never enters the choice, so
  # the artwork is keyed by the transport and not by the surround.
  #
  # Same full-cell contract as the ordinary leaves: the aperture clip,
  # not the drawn size, bounds the leaf, and one tile serves both widths.
  # A Lift landing is OpenApart by default, so the same symmetry rule as
  # door-L0 applies - a 1-wide landing splits this tile at the cell centre
  # and wears both halves, and an asymmetric panel reads as two mismatched
  # leaves with nothing to catch it.
  door-lift-L0:
    cell: [8, 0]
    variants: 3
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
    tintable: false

  # The right-hand leaf of a two-cell-wide Lift landing: the two cells of
  # one joined landing leaf. A shaft is refused at build past two cells
  # wide (#1055), so this is the widest landing the family is drawn for.
  door-lift-R0:
    cell: [9, 0]
    variants: 3
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
    tintable: false

  # The Shuttle hatch. One leaf, not a pair: a Shuttle landing Door is
  # authored one cell wide, so the hatch family has no right-hand leaf and
  # no `-R0` to author. The hatch tile stands in for both roles rather
  # than reaching across families for art that was never drawn - a wider
  # hatch would then read as two hatches side by side, which is a visible
  # wrong rather than a silent one.
  door-shuttle-L0:
    cell: [10, 0]
    variants: 3
    content: [0, 0, 128, 320]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 1.0]
    tintable: false

  # A Button's two states are two tiles, not one tile and two tints, so
  # the state is legible from the artwork alone at the 12.8 x 12.8 px the
  # control actually occupies. Both are untintable: the renderer's enabled
  # green, disabled grey and Broken red are a wireframe and fallback fact,
  # and letting them multiply into the art would wash out the difference
  # between the two tiles the state is carried by.
  #
  # The drawn size is the Button's own shape - CORE_BUTTON_SIZE wide and
  # that divided by the cell's y:x render ratio tall.
  button-enabled:
    cell: [4, 0]
    content: [0, 0, 13, 13]
    offset: [0.0, 0.0]
    drawn_size: [0.1, 0.04]
    tintable: false

  button-disabled:
    cell: [5, 0]
    content: [0, 0, 13, 13]
    offset: [0.0, 0.0]
    drawn_size: [0.1, 0.04]
    tintable: false

  # The three Window styles are three tiles at the same size: a one-cell,
  # one-Level Window is `1 - 2 * CORE_WINDOW_X_INSET` wide by
  # `CORE_WINDOW_HEIGHT` tall, which is 0.8 x 0.3 World units and
  # 102 x 96 px here. The style is the artwork - clear glass, frosted
  # glass, tinted glass - and never a different geometry, so a Window's
  # aperture, its Background seam and its clip stay identical across all
  # three.
  window-clear:
    cell: [0, 1]
    content: [0, 0, 102, 96]
    offset: [0.0, 0.0]
    drawn_size: [0.8, 0.3]
    tintable: false

  window-frosted:
    cell: [1, 1]
    content: [0, 0, 102, 96]
    offset: [0.0, 0.0]
    drawn_size: [0.8, 0.3]
    tintable: false

  window-tinted:
    cell: [2, 1]
    content: [0, 0, 102, 96]
    offset: [0.0, 0.0]
    drawn_size: [0.8, 0.3]
    tintable: false

  # A Booth Window is two tiles that compose rather than two states of
  # one. `booth-window-open` is the frame: opaque at its edges,
  # transparent through its centre, and it never moves. The shutter is
  # the opaque panel that slides behind that frame, and the frame's
  # transparent centre is what makes the slide visible. Fully closed, the
  # shutter fills that centre, so the closed state is already drawn and
  # needs no tile of its own: the `booth-window-closed` panel this set
  # carried was required by the Objects contract and named by no draw
  # call, so #1031 dropped it rather than inventing a consumer for it.
  booth-window-open:
    cell: [3, 1]
    content: [0, 0, 102, 96]
    offset: [0.0, 0.0]
    drawn_size: [0.8, 0.3]
    tintable: false

  # The shutter fills the frame's transparent centre, so its drawn size is
  # that centre, not the frame: 42/52 of the frame's 0.8 across and 38/48
  # of its 0.3 down, which is 0.6461538 x 0.2375 World units and
  # 83 x 76 px on this grid. The renderer clips it to that same inner
  # rect, so the shutter can never paint over the frame it slides behind.
  booth-window-shutter:
    cell: [4, 1]
    content: [0, 0, 83, 76]
    offset: [0.0, 0.0]
    drawn_size: [0.6461538, 0.2375]
    tintable: false

  # The Marker is the one tile in this set that takes a tint. Its icon is
  # grayscale so the gold the renderer carries multiplies into it, and
  # that gold is `core::SelectedAgentColour` - the same colour the Agent
  # selection highlight resolves to - which is what lets a destination
  # read as part of the Agent colour vocabulary rather than as a fixed
  # decal. Make this tile untintable and the icon goes white, which is how
  # a tintability regression shows up here.
  #
  # The icon's on-screen size is a screen-space fact (`MarkerIconSize`, a
  # fixed pixel longest edge that does not follow the World cell), so the
  # declared drawn size is the authored art's own reference extent:
  # 32 x 44 px at this grid, 0.25 x 0.1375 World units.
  marker:
    cell: [0, 2]
    content: [0, 0, 32, 44]
    offset: [0.0, 0.0]
    drawn_size: [0.25, 0.1375]
    tintable: true

  # The Lift car is the vehicle inside the shaft. Its own geometry is
  # `cellsWide - 2 * CORE_LIFT_CAR_BORDER` across `CORE_LIFT_CAR_HEIGHT`
  # - the car is inset from the shaft walls by the border on each side, and
  # it is a hand taller than a Door so the roof reads as a roof - which for
  # the regular one-cell car is 0.9 x 0.55 World units and 115 x 176 px
  # here. The renderer draws it into the car's live shape, so the sprite
  # fills the cell the car occupies and travels with the car through the
  # shaft rather than sitting at the authored cell.
  lift-car:
    cell: [1, 2]
    content: [0, 0, 115, 176]
    offset: [0.0, 0.0]
    drawn_size: [0.9, 0.55]
    tintable: false

  # The Platform lift is a slab, not a car: `cellsWide` across and 0.05
  # World units thick, with no car border because there is no car body to
  # inset. A one-cell slab is therefore 1.0 x 0.05 and 128 x 16 px. The
  # renderer draws it into the slab's live bounds - the moving thing - and
  # never into the shaft bounds, which is what keeps a slab halfway up a
  # four-Level shaft drawn halfway up rather than parked at the bottom.
  platform-lift:
    cell: [2, 2]
    content: [0, 0, 128, 16]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 0.05]
    tintable: false

  # The Shuttle carriage is composed from three role tiles rather than
  # from art cut per width. A carriage's cells are all one cell wide and
  # `CORE_SHUTTLE_CAR_HEIGHT` tall - 1.0 x 0.55 World units, 128 x 176 px
  # - and the only difference between them is which end of the train they
  # are at, which is exactly what the role in the name carries. So a
  # three-cell carriage is L0, M0, R0; a four-cell carriage is L0, M0, M0,
  # R0; a two-cell carriage is L0, R0 with no middle at all. No width needs
  # its own artwork, and widening a carriage buys cells rather than tiles.
  shuttle-L0:
    cell: [3, 2]
    content: [0, 0, 128, 176]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 0.55]
    tintable: false

  shuttle-M0:
    cell: [4, 2]
    content: [0, 0, 128, 176]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 0.55]
    tintable: false

  shuttle-R0:
    cell: [5, 2]
    content: [0, 0, 128, 176]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 0.55]
    tintable: false

  # The connector between two carriages keeps a bare name and no role
  # suffix, because it is not drawn at a cell of a carriage. It is drawn
  # at the join: the one-cell gap that separates one carriage from the
  # next, which belongs to neither. A role name would claim it was a cell
  # position on the carriage and invite someone to compose it into the
  # carriage's own cell count, which would put a coupling in the middle of
  # a train. Same extent as a carriage cell - 1.0 x 0.55, 128 x 176 px -
  # since it spans the same height across that gap.
  shuttle-connector:
    cell: [0, 3]
    content: [0, 0, 128, 176]
    offset: [0.0, 0.0]
    drawn_size: [1.0, 0.55]
    tintable: false

  # No `force-bridge` tile, deliberately. A Force Bridge's span is
  # continuous and arbitrary - it can be any fraction of a cell wide, over
  # any gap - so a fixed tile would be stretched wrong at most lengths it
  # gets used at. The 2px line is honest about being an energy field, and
  # `ObjectTileset::load` refuses one so the decision cannot be reversed
  # by an edit to this file that nobody thought about.

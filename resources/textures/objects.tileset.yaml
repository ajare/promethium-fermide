  # Role-name aliases over the same Furniture art (#1029).
  #
  # The shipped Furniture catalogues now name their tiles by the role convention,
  # `<piece>-<role><level>`, because that is what FurnitureAtlas speaks and
  # what a new World therefore draws. Every World still drawing this sheet has to
  # go on drawing exactly what it drew before, so the same pixel regions stay
  # reachable under the names those catalogues now use. The aliases say nothing
  # new about the art: `sofa-left` is the sofa's left cap and `chair` is the
  # chair's anchor cell. Only the middle roles are absent, because this sheet
  # never had middle art - a Furniture piece wider than two cells was not
  # something the old sheet could express at all.
  chair-L0:
    cell: [4, 1]
    content: [0, 0, 64, 160]
  sofa-L0:
    cell: [0, 3]
    content: [0, 0, 64, 160]
  sofa-R0:

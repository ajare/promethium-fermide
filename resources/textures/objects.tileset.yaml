# The version 1 object tileset. Since the #1013 terminus deleted the old
# `objects.png` sheet, this file survives to author the custom theme sheets
# that share its vocabulary - `StationFurnitureAtlas` and
# `DoctorFemale1Atlas` - because a version 1 object set carries the v1
# required-tile contract and those sheets author no render offsets or drawn
# sizes to move. The `image` field names the sheet these rectangles were
# drawn against; that file is gone, and nothing reads the field at runtime -
# the install takes pixel regions from each theme's own `ImageSet` resource,
# so only the names declared here are load-bearing.
#
# Pixel coordinates use top-left origin. Each cell is one world unit.
# Content rectangles exclude alpha padding and may span adjacent storage cells.
version: 1
image: objects.png
size: [320, 960]
tile_size: [64, 160]
sprites:

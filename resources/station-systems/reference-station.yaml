# Meridian reference station (#422)
#
# One reconciled, editable reference configuration that demonstrates the
# implemented Station systems with internally consistent budgets. This is
# the packaged application resource: the editor loads it into the draft,
# the World persists it through the ordinary stationSystems document path,
# and the Lua runtime runs it unchanged. The stationSystems section below
# is read by the authoritative World station systems reader - the same
# validation a saved World passes.
#
# Do not sum incompatible source-spec examples here: every rate below is
# one reconciled number in one declared unit, derived from the recorded
# provenance entries, with a single growth/auxiliary/reserve margin per
# budget line (no duplicated margins).
name: "Meridian reference station"
schemaVersion: 102
summary: >
  A four-crew deep-space station configuration that demonstrates the
  whole implemented Station system in one internally consistent
  register: solar power with a battery buffer and fuelled backup, a
  hab/greenhouse/pond ECLSS with crew metabolism, humidity condensation,
  water treatment, oxygen makeup by electrolysis and CO2 capture, a
  Sabatier/methane-processing carbon loop with a net hydrogen demand
  that never reads as self-sustaining, an aerobic digester that returns
  recovered nutrients and water from organic waste, crop and algae
  biology with harvest, a segregated hazardous processing bay with a
  treatment energy requirement and a protected hazardous coolant loop,
  scheduled airlock cycles, a scheduled maintenance job and an
  installation outage. Every store, budget and inventory below is one
  reconciled value; the numbers are provisional model assumptions with
  the recorded provenance, not flight-qualified engineering.

provenance:
  - coefficient: "Crew oxygen uptake"
    value: "0.84 kg per person per day (authored as 9.722222e-6 kg/s)"
    units: "kg O2 per crew per simulated second"
    source: >
      Provisional biological assumption: typical human resting-to-light-activity
      oxygen uptake from published life-support literature (approximately
      0.84 kg/person/day). Converted to per-second by dividing by 86400.
  - coefficient: "Crew carbon dioxide production"
    value: "1.02 kg per person per day (authored as 1.180556e-5 kg/s)"
    units: "kg CO2 per crew per simulated second"
    source: >
      Provisional biological assumption at a respiratory quotient of about
      0.85 against the oxygen uptake above; the CO2/O2 mass ratio 1.214
      is consistent with a mixed diet.
  - coefficient: "Crew food and potable water"
    value: "0.8 kg dry food and 1.8 kg potable water per person per day"
    units: "store units (kg) per crew per simulated second"
    source: >
      Provisional: dry food at 17000 kJ/kg dry (about 4000 kcal/kg dry);
      potable water is the drinking fraction only, with the remaining water
      demand met by recovered and treated process water routed through the
      same treatment chain in a longer-haul configuration. The consumed
      mass the waste streams do not carry away is reported as explicit
      retained body mass, never discarded.
  - coefficient: "Crew metabolic heat and moisture"
    value: "0.1 kW sensible heat and 0.55 kg evaporated moisture per person per day"
    units: "kW and kg/s per crew"
    source: >
      Provisional: nominal sensible heat about 100 W per person; evaporated
      moisture is the fraction returned to the cabin air that the water
      collector must condense. The declared heat sits well below the food
      energy minus the energy still bound in the urine and organic-waste
      streams, so the crew energy ledger closes with margin.
  - coefficient: "Electrolysis electrical dose"
    value: "4.5 kWh per kg of split water"
    units: "kWh/kg"
    source: >
      Provisional process assumption above the declared chemical floor of
      3.70 kWh/kg (the lower heating value of the hydrogen produced at
      the declared stoichiometry); the difference is booked as process
      heat into the class-matched sink. Not a machine qualification.
  - coefficient: "Sabatier electrical dose and reaction heat"
    value: "1.0 kWh per kg CO2 converted; exothermy derived from declared heating values"
    units: "kWh/kg CO2"
    source: >
      Provisional process assumption. The released heat is not authored
      separately: it is the chemical energy the hydrogen reactant carried
      that the methane product does not retain, derived from the declared
      lower heating values and the declared stoichiometry.
  - coefficient: "Methane-processing electrical dose"
    value: "2.0 kWh per kg CH4 processed"
    units: "kWh/kg CH4"
    source: >
      Provisional process assumption above the declared endothermic
      reaction-heat demand of about 1.30 kWh/kg; the difference is
      process heat routed to the sink. The recovered hydrogen is recycled
      feed, not free supply: the Sabatier stage consumes twice the
      hydrogen per methane it makes as the processor returns, so the
      combined loop retains a net hydrogen demand.
  - coefficient: "Chilled service COP"
    value: "3.0 cooling per unit work at rated"
    units: "dimensionless COP"
    source: >
      Provisional vapour-cycle assumption for the habitable-class chilled
      service; auxiliaries are authored separately at 0.05 kW.
  - coefficient: "Radiator effective rejection"
    value: "emissivity 0.90 x view factor 0.90 against a -30 C effective sink"
    units: "dimensionless factors, Celsius sink temperature"
    source: >
      Provisional radiator/view assumption under the declared
      Stefan-Boltzmann law. Areas are effective areas for the declared
      emissivity and view factor; no fin efficiency or distribution
      modelling is promised. The -30 C effective sink represents a
      sun-lit orbit-averaged back-radiation environment, not deep space.
  - coefficient: "Crop growth yield and respiration"
    value: "0.1 kg dry biomass per kWh of delivered light; 0.012 per hour respiration"
    units: "kg/kWh and 1/hour"
    source: >
      Provisional biological assumption (tunable model parameter, not
      validated agronomy). The yield fixes 1700 kJ of chemical energy per
      kWh against the 3600 kJ the light carries, well inside the declared
      energy ceiling.
  - coefficient: "Digester recovery fractions"
    value: "0.8 bound N/P/K, 0.7 minerals, 0.7 moisture"
    units: "fractions of the feed's bound content"
    source: >
      Provisional biological assumption for an aerobic digester; the
      residue is the mass-balance remainder and the declared reaction
      heat (600 kJ/kg feed) is capped by the feedstock's own declared
      chemical energy (2400 kJ/kg feed).

assumptions:
  - topic: "Water makeup and recovery"
    text: >
      Cabin humidity is condensed by the hab water collector on a
      chilled-surface coolant loop down to 40 percent relative humidity
      and lands in the raw water buffer. The Sabatier product water, the
      digester recovered water and (when the backup runs) the fuel-cell
      product water all join the same raw buffer. One normal-class
      treatment closes the loop: raw to potable-grade fresh at a 0.9
      recovery ratio, with the concentrate retained for disposal. The
      fresh store carries a protected reserve of 30 kg that electrolysis
      and industry can never eat into; the crew drinking store carries a
      50 kg protected life-support reserve and is refilled by scheduled
      potable deliveries. Makeup water is therefore explicit: condensation
      and process recovery first, delivered potable top-ups second, and
      every kilogram that cannot be treated stays visible in the raw
      buffer rather than disappearing.
  - topic: "Hazardous autonomy"
    text: >
      The hazardous processing bay is a self-contained segregated
      service. Hazardous water (hazWaterRaw) is processed only by the
      hazardous-class treatment, which releases treated material only
      on complete treatment energy evidence; a curtailed energy dose
      holds the material unqualified. The hazardous coolant loop owns its own finite
      coolant inventory, is authored a critical service, so its containment circulation is drawn ahead of discretionary load, and never shares
      a store, a loop or a generic transfer with the normal side.
      Hazardous concentrate leaves the station only through its own
      scheduled ejection. No normal-class process touches a hazardous
      store anywhere in this configuration, and the validator refuses
      any edit that would.
  - topic: "Hydrogen and carbon balance"
    text: >
      Hydrogen is produced only by electrolysis and is spent on the
      Sabatier carbon loop; the methane processor returns recycled
      hydrogen to the same store. Because the Sabatier stage consumes
      about twice the hydrogen per methane that pyrolysis returns, the
      combined loop retains a net hydrogen demand and can never run on
      its own return - the hydrogen store's movement closes over
      electrolysis production minus that net demand. Carbon is captured
      from the hab, converted to methane, split to solid carbon, and the
      solid carbon is ejected: every kilogram of carbon has a named
      pathway and a store that holds it. The hab CO2 capture rate is
      sized above the crew CO2 production so cabin quality holds while
      the conversion chain works through the capture inventory; the
  - topic: "Microbial participation"
    text: >
      The aerobic digester is the microbial participant: it eats the
      crew's organic waste (a declared compound feedstock), consumes
      oxygen, process water, electricity and culture medium, and returns
      recovered nutrients (pumped to the crop nitrogen store), recovered
      water (to the raw buffer), CO2 (to the capture inventory) and an
      unrecoverable residue routed to the terminal waste store. The
      culture carries one aggregate condition in [0,1] - never
      individual organisms - degraded by starvation, medium exhaustion,
      cold stress and heat stress at the recorded per-hour rates and
      recovering at 0.02 condition points per hour only while fed,
      supplied and inside its 15-45 C window, consuming replacement
      biological stock per recovered point. All microbial coefficients
      are provisional biological assumptions, not validated biology.
  - topic: "Thermal model"
    text: >
      Process heat and the chiller condenser heat collect in the
      class-matched low-class process sink and reject through one
      effective-area radiator by the declared Stefan-Boltzmann law
      against the -30 C effective sink. The chilled service is a real
      chain: habitat and life-support heat enters the chilled water
      reservoir, the protected coolant loop circulates it through the
      chiller evaporator, and the condenser lifts it to the process
      sink. A passive thermal buffer on the process sink absorbs what
      the radiator cannot take at the instant, and returns it only when
      real rejection capacity comes back. Declared temperature limits
      are reported crossings, never clamps.
  - topic: "Power budget"
    text: >
      One 20 kW solar array at a constant 0.85 illumination covers the
      reconciled nominal demand of about 16 kW with a small surplus that
      charges the battery; the battery (80 kWh usable above a 20 kWh
      reserve floor) rides transients and is never a sustained source.
      The fuelled generator and the fuel-cell backup are authored at
      zero commanded output for normal operation: they exist to be
      started when the sun or the batteries cannot carry the load, with
      their startup energy, ramp and shutdown-heat contracts fully
      authored. Dispatch mode is manual: the authored commanded outputs
      are authoritative.

qualification: >
  Scope and qualification limits. This is a provisional, internally
  consistent model configuration for demonstrating the implemented
  Station system: it is not a flight-qualified engineering baseline and
  claims no validated biology, agronomy, phycology, reactor physics or
  qualified machine behaviour. The reconciled budgets are balanced for
  the documented normal-operation scenario below; long-duration
  closure over days and weeks (nutrient cycling completeness, consumable
  resupply cadence, radiator long-term sizing, biological stability) is
  explicitly NOT qualified by this configuration. Biological and
  process coefficients are tunable model parameters with recorded
  provenance; the declared temperature, pressure and quality limits are
  reported crossings, never enforced clamps. The configuration never
  reads Agent counts, movement, health or behaviour, and no station
  input here is derived from World entities: crews, occupants and loads
  are authored assignments only.

scenarioSeconds: 900.0
scenarioNotes: >
  Reproducible normal-operation scenario: enable the configuration,
  resume the World clock and run 900 simulated seconds (fifteen
  simulated minutes) at the fixed tick. Expected observable result at
  the tick/snapshot/event seam: the station stays healthy with no unmet
  critical demand; the crew metabolises at full scale; the hab oxygen
  partial pressure stays above its 12 kPa floor and CO2 below its
  0.4 kPa ceiling; the collector, treatment, electrolysis, capture,
  Sabatier, pyrolysis and digester stages all run and book their
  declared flows; harvest fires on both the crop and the algae; the
  per-unit and per-constituent boundary ledgers close within the
  declared tolerance; the generator outage window opens at 180 s and
  closes at 300 s, the chiller maintenance job runs 300 s from 300 s
  and completes at 600 s, and the mid-scenario food resupply arrives
  at 450 s, all without disturbing service; and the whole run replays
  identically after a World reset or a document round trip.


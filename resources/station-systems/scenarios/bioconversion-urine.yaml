# #735: urine-nitrification tracer at the four-crew production rate (4 kg/day).
# Standalone Station configuration; load in Station systems, then Apply.
# One day: N recovered/nitrified 0.048 kg; O2 0.24456 kg (legacy 3.2 kg);
# CO2 0.0324 kg; water recovered 2.66 kg; dilution water 0;
# medium 0.0009 kg; reaction heat 10.08 kJ; residue 1.41206 kg.
# Quasi-steady, provisional biology. No inhibition or nitrifier growth yield.
# Plain products, actual-blend feed. Solar and sink sized for a full day.

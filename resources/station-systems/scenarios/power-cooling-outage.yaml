scenarioKind: emergency
limitingServices:
- item: Solar generation (eclipse profile)
  detail: 'From 120 s to 420 s the array delivers zero: the station''s primary source is the limiting
    service and everything downstream is rationed against battery, generator and curtailment.'
- item: Chilled service (chillerMain outage at 25 percent)
  detail: 'The scheduled outage caps the chiller''s deliverable at 0.75 kW: the chilled loop is
    not held at its 5 C setpoint and rides above it for the window. The cooling shortfall is visible
    as lost setpoint-following under the capped service, never as demand silently met from elsewhere.
    The chiller is a protected critical service and is never shed - it is simply capped.'
- item: Low-priority external loads during the startup/ramp gap
  detail: Science and workshop loads curtail while the generator starts and ramps and whenever
    the battery cannot cover them; their authored maxCurtailment allows full shedding. This is
    the supervisory response, not a hidden reserve.
eventOrdering:
- item: eclipse onset before generator running
  detail: Solar zero at 120 s; the generator needs its 10 s startup plus ramp before rated output,
    so the battery alone carries the gap first.
- item: generator running before chiller derate relief
  detail: The generator runs through the outage window (120-420 s); the chiller cap lifts only
    when the same window closes.
- item: sun return before generator shutdown-heat tail
  detail: At 420 s solar returns and dispatch releases the generator; its 1 kW x 120 s shutdown
    heat keeps loading the generation sink after electrical output stops - stopping output never
    erases residual heat.
- item: generator shutdown before full load recovery
  detail: Curtailed loads return to full delivery only after their dwell/hysteresis windows; full
    supply is re-established after the generator is back off service.
outcomeRanges:
- item: Unmet critical electrical demand
  detail: 'Zero (within 1e-9 kW) for the entire run: the protected life-support and comms floors
    are never left unserved. Provisional assumption: battery plus generator ramp always cover
    the 2 kW of protected floors.'
- item: Battery energy through the eclipse
  detail: Stored energy falls during 120-420 s but stays above the protected reserve floor (reserveExhausted
    never true); the 80 kWh usable bank against a sub-300 s shortfall of roughly 4 kWh cannot
    exhaust it. Provisional.
- item: Chilled-loop ride during the derate
  detail: The chilled-water loop stays above its 5 C cooling setpoint and within 1.0 K of its
    8 C start through the 300 s derate (its 20 MJ/K declared capacity absorbs the shortfall at
    the capped extraction rate). Provisional thermal assumption; the declared limit is a report,
    never a clamp.
- item: Full supply restored
  detail: 'All external loads at full delivery and the generator back to Stopped by 720 s (provisional:
    420 s sun return + 120 s shutdown tail + dwell/hysteresis headroom).'

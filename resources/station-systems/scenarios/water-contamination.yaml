# #744: loaded hazardous ingress -> hazardous loop -> energy-evidenced treatment.
# Load in Station systems, Apply, Run. 10-second public-World verification.
# Hazard-side crew and crop are zero-tolerance acceptance probes (not exposure models).
# They draw nothing and report water quality: total dissolved above ... tolerance.
# Normal consumers use only the cleared outlet. The filter removes all dry load.
# Reduce solar capacity: incomplete energy evidence holds treated output unqualified.
# Consumer quality tolerances constrain uptake independently of wiring or class labels.
schemaVersion: 101
stationSystems:
  enabled: true
  observationIntervalSeconds: 1
  dispatchMode: manual
  stores:
  - id: ingress
    materialId: water
    unit: kg
    capacity: 100
    startingQualified: 10
    startingUnqualified: 0
    composition: {moisture: 0.99, nutrientNitrogen: 0, atmosphericNitrogen: 0, phosphorus: 0, potassium: 0, otherMinerals: 0, energyKJPerKgDry: 3600}
  - id: loop
    materialId: water
    unit: kg
    capacity: 100
    startingQualified: 0
    startingUnqualified: 0
    composition: {moisture: 0.99, nutrientNitrogen: 0, atmosphericNitrogen: 0, phosphorus: 0, potassium: 0, otherMinerals: 0, energyKJPerKgDry: 3600}
  - id: cleared
    materialId: water
    unit: kg
    capacity: 100
    startingQualified: 0
    startingUnqualified: 0
    composition: {moisture: 0.999, nutrientNitrogen: 0, atmosphericNitrogen: 0, phosphorus: 0, potassium: 0, otherMinerals: 0, energyKJPerKgDry: 3600}
  - id: concentrate
    materialId: water-concentrate
    unit: kg
    capacity: 100
    startingQualified: 0
    startingUnqualified: 0
    composition: {moisture: 0.5, nutrientNitrogen: 0, atmosphericNitrogen: 0, phosphorus: 0, potassium: 0, otherMinerals: 0, energyKJPerKgDry: 3600}
  - {id: media, unit: kg, capacity: 10, startingQualified: 10, startingUnqualified: 0}
  - {id: N, unit: kg, capacity: 1, startingQualified: 0, startingUnqualified: 0}
  - {id: P, unit: kg, capacity: 1, startingQualified: 0, startingUnqualified: 0}
  - {id: K, unit: kg, capacity: 1, startingQualified: 0, startingUnqualified: 0}
  - {id: minerals, unit: kg, capacity: 1, startingQualified: 0, startingUnqualified: 0}
  - {id: food, unit: kg, capacity: 1, startingQualified: 0, startingUnqualified: 0, composition: {moisture: 0, nutrientNitrogen: 0, atmosphericNitrogen: 0, phosphorus: 0, potassium: 0, otherMinerals: 0, energyKJPerKgDry: 3600}}
  - {id: urine, unit: kg, capacity: 1, startingQualified: 0, startingUnqualified: 0, composition: {moisture: 0, nutrientNitrogen: 0, atmosphericNitrogen: 0, phosphorus: 0, potassium: 0, otherMinerals: 0, energyKJPerKgDry: 3600}}
  - {id: waste, unit: kg, capacity: 1, startingQualified: 0, startingUnqualified: 0, composition: {moisture: 0, nutrientNitrogen: 0, atmosphericNitrogen: 0, phosphorus: 0, potassium: 0, otherMinerals: 0, energyKJPerKgDry: 3600}}
  - {id: hazN, unit: kg, capacity: 1, startingQualified: 0, startingUnqualified: 0}
  - {id: hazP, unit: kg, capacity: 1, startingQualified: 0, startingUnqualified: 0}
  - {id: hazK, unit: kg, capacity: 1, startingQualified: 0, startingUnqualified: 0}
  - {id: hazMinerals, unit: kg, capacity: 1, startingQualified: 0, startingUnqualified: 0}
  - {id: hazFood, unit: kg, capacity: 1, startingQualified: 0, startingUnqualified: 0, composition: {moisture: 0, nutrientNitrogen: 0, atmosphericNitrogen: 0, phosphorus: 0, potassium: 0, otherMinerals: 0, energyKJPerKgDry: 3600}}
  - {id: hazUrine, unit: kg, capacity: 1, startingQualified: 0, startingUnqualified: 0, composition: {moisture: 0, nutrientNitrogen: 0, atmosphericNitrogen: 0, phosphorus: 0, potassium: 0, otherMinerals: 0, energyKJPerKgDry: 3600}}
  - {id: hazWaste, unit: kg, capacity: 1, startingQualified: 0, startingUnqualified: 0, composition: {moisture: 0, nutrientNitrogen: 0, atmosphericNitrogen: 0, phosphorus: 0, potassium: 0, otherMinerals: 0, energyKJPerKgDry: 3600}}
  transfers:
  - {id: ingress, sourceId: ingress, destinationId: loop, unit: kg, ratePerSecond: 0.1, priority: 1}
  solarArrays:
  - id: supply
    capacityKW: 10
    illumination: {constantLevel: 1, periodSeconds: 0, segments: []}
  waterTreatments:
  - id: barrier
    sourceStoreId: loop
    treatedStoreId: cleared
    concentrateStoreId: concentrate
    consumableStoreId: media
    throughputKgPerS: 0.05
    recoveryRatio: 0.8
    specificEnergyKWhPerKg: 0.01
    consumablePerKg: 0.01
    priority: 1
  atmospheres:

    waterQuality: {maxTotalDissolved: 0}
    composition: {moisture: 0, nutrientNitrogen: 0, atmosphericNitrogen: 0, phosphorus: 0, potassium: 0, otherMinerals: 0, energyKJPerKgDry: 3600}
    growingAreaM2: 10

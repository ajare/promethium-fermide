    id: normal-crop
    atmosphereId: normal
    waterStoreId: cleared
    waterQuality: {maxTotalDissolved: 0}
    nitrogenStoreId: N
    phosphorusStoreId: P
    potassiumStoreId: K
    mineralsStoreId: minerals
    composition: {moisture: 0, nutrientNitrogen: 0, atmosphericNitrogen: 0, phosphorus: 0, potassium: 0, otherMinerals: 0, energyKJPerKgDry: 3600}
    growingAreaM2: 10
    maxBiomassDensityKgPerM2: 2
    initialBiomassKg: 0.01
    lampRatedKW: 0.1
    illumination: {constantLevel: 1, periodSeconds: 0, segments: []}
    circulationPowerKW: 0
    growthYieldKgPerKWh: 0.5
    respirationPerHour: 0
    transpirationKgPerKgGrowth: 10
    minGrowingTemperatureC: 10
    maxGrowingTemperatureC: 35
    foodStoreId: food
    wasteStoreId: waste
    edibleFraction: 0.6
    harvestTriggerKg: 0

scenarioKind: emergency
limitingServices:
- item: Chiller maintenance (tool kit)
  detail: 'The 0.2 kg tool-kit inventory against the 1.0 kg requirement is the limiting service
    for the first window: the job cannot reserve and the window is missed. Provisional: the kit
    is off-station until the scheduled drop.'
- item: Chilled service during maintenance isolation
  detail: 'While the job is Active (1200-1500 s) the chiller is held at zero availability: the
    chilled-class cooling demand is unmet for the isolation window and the chilled-water loop
    warms. This is the real cost of doing the maintenance, not a cosmetic pause.'
eventOrdering:
- item: blocked before missed
  detail: The job blocks at 300 s (tool kit cannot cover) and its window closes missed at 600
    s - the miss is reported with the blocking reason and never back-filled.
- item: kit delivery before second-window start
  detail: The tool-kit drop lands at 900 s; the job can only start once the second window opens
    at 1200 s with the kit reservable.
- item: isolation before completion
  detail: The chiller is isolated from the 1200 s start for the full 300 s duration; completion
    at 1500 s releases the isolation and the media consumption lands in the waste ledger.
outcomeRanges:
- item: Missed occurrences
  detail: 'Exactly 1 missed occurrence by the end of the run (the 300-600 s window). Provisional:
    the recurrence places the next window at 1200 s, inside the scenario.'
- item: Completed occurrences
  detail: Exactly 1 completed occurrence by 1800 s, completing between 1499 s and 1501 s (the
    authored 300 s duration from the 1200 s window opening).
- item: Maintenance waste and media
  detail: The maintenance waste store ends with exactly the 0.5 kg consumed media and the treatment
    media store is 0.5 kg lower than its start; the reusable tool kit returns to inventory (net
    +1.2 kg from the drop). Exact by the reservation contract.
- item: Chilled-water warming during isolation
  detail: Less than 1.0 K over the 300 s isolation (roughly 2.5 kW into 20 MJ/K with the derated
    service off). Provisional thermal assumption; limits are reports, never clamps.

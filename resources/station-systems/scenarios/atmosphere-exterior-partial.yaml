# Load in Station systems, then Apply and run for 240 simulated seconds.
# Closed until t=60 s; 25% open until t=180 s; then sealed again.
# Space never fills. All four gases retain ~83.87% of their starting mass.
# This is thermally neutral diffusion, not choked-flow decompression.
schemaVersion: 105
stationSystems:
  enabled: true
  systemsStepWorldTicks: 6
  observationIntervalSeconds: 1
  atmospheres:
    - id: habitat
      volumeM3: 100
      startingOxygenKg: 30
      startingNitrogenKg: 80
      startingCarbonDioxideKg: 0.6
      startingWaterVapourKg: 0.1
      startingTemperatureC: 20
      thermalCapacityKJPerK: 10000
      reservoirId: ""
      exchangerConductanceKWPerK: 0
      occupants: 0
      oxygenUsePerOccupantKgPerS: 0
      co2ProductionPerOccupantKgPerS: 0
      sensibleHeatPerOccupantKW: 0
      moistureAdditionPerOccupantKgPerS: 0
      leakRateKgPerS: 0
      minPressureKPa: 1
      maxPressureKPa: 200
      minOxygenPartialPressureKPa: 0
      maxCarbonDioxidePartialPressureKPa: 0
  atmospherePathways:
    - id: exterior-opening
      aAtmosphereId: habitat
      bAtmosphereId: $exterior
      areaM2: 1
      initialOpenFraction: 0
  pathwayCommands:
    - id: open-quarter
      pathwayId: exterior-opening
      openFraction: 0.25
      occurrenceSeconds: 60
      priority: 0
    - id: seal-exterior
      pathwayId: exterior-opening
      openFraction: 0
      occurrenceSeconds: 180
      priority: 0
layout:
  panX: 24
  panY: 24
  zoom: 0.8
  nodes:
    - {key: "Atmosphere:habitat:0", x: 0, y: 0}
    - {key: "Exterior:$exterior:0", x: 650, y: 0}

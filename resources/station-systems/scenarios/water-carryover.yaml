# #743: G1 -> G2 bridge. Load in Station systems, then Apply.
# Per day: 4 kg feed, 0.048 kg recovered N, 0.006 kg carried N,
# 2.666 kg loaded recovered water (2.66 kg water), 1.40606 kg residue.
# Effluent N concentration = 0.006 / 2.666 = 0.00225056264 kg/kg.
# Crop irrigation tolerates 0.003 kg/kg N: the dilute stream is accepted.
# Nutrient uptake remains the existing separate fertilizer-port model;
# irrigation accepts the N load but does not substitute it for fertilizer.
# Provisional biology; no inhibition or nitrifier growth yield.

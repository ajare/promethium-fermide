  - {id: treated, unit: kg, capacity: 1000, startingQualified: 0, startingUnqualified: 0}
  - {id: concentrate, unit: kg, capacity: 1000, startingQualified: 0, startingUnqualified: 0}
  - {id: media, unit: kg, capacity: 100, startingQualified: 10, startingUnqualified: 0}
  solarArrays:

# #736: zero bioconversion; water-only pass-through with an inert dry balance.
# Load in Station systems and Apply. Per kg feed: water 0.999 kg,
# inert residue 0.001 kg; O2, CO2, heat, medium and nutrients all zero.
# Atmospheric nitrogen is inert, not recoverable nutrient nitrogen.
# All-zero dry fractions would mean organic dry mass, NOT inert solids.
# Set waterRecovery to 0 to demonstrate a zero-throughput no-op instead.
schemaVersion: 99
stationSystems:
  enabled: true
  observationIntervalSeconds: 1.0
  trendRetentionSeconds: 3600.0
  dispatchMode: manual
  stores:
  - id: nearlyWater
    unit: kg
    capacity: 100.0
    startingQualified: 10.0
    startingUnqualified: 0.0
    protectedReserve: 0.0
    hazardClass: normal
    composition:
      moisture: 0.999
      nutrientNitrogen: 0.0
      atmosphericNitrogen: 1.0
      phosphorus: 0.0
      potassium: 0.0
      otherMinerals: 0.0
      energyKJPerKgDry: 0.0

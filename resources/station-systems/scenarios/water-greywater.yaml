# #741 partial removal (quality gates are a later slice).
# 100 kg/day at 0.2% organics, water recovery 85%, organics removal 95%:
# treated 84.84 kg/day at 0.011787% organics; concentrate 15.16 kg/day
# at 1.2533% organics. Every drawn constituent is retained exactly once.
# Load in Station systems, then Apply. Concentrate starts empty; its
# declaration is only a seed, not the actual deposited composition.
schemaVersion: 100
stationSystems:
  enabled: true
  observationIntervalSeconds: 1.0
  stores:
  - id: greywater
    materialId: water
    unit: kg
    capacity: 1000
    startingQualified: 200
    startingUnqualified: 0
    composition:
      moisture: 0.998
      nutrientNitrogen: 0
      atmosphericNitrogen: 0
      phosphorus: 0
      potassium: 0
      otherMinerals: 0
      energyKJPerKgDry: 17000
  - id: treated
    materialId: water
    unit: kg
    capacity: 1000
    startingQualified: 0
    startingUnqualified: 0
    composition:
      moisture: 0.998
      nutrientNitrogen: 0
      atmosphericNitrogen: 0
      phosphorus: 0
      potassium: 0
      otherMinerals: 0
      energyKJPerKgDry: 17000
  - id: concentrate
    materialId: water-concentrate
    unit: kg
    capacity: 1000
    startingQualified: 0
    startingUnqualified: 0
    composition:
      moisture: 0.5
      nutrientNitrogen: 0
      atmosphericNitrogen: 0
      phosphorus: 0
      potassium: 0
      otherMinerals: 0
      energyKJPerKgDry: 17000
  - id: media
    unit: kg
    capacity: 100
    startingQualified: 10
    startingUnqualified: 0
  solarArrays:
  - id: supply
    capacityKW: 10
    illumination:
      constantLevel: 1
      periodSeconds: 0
      segments: []
  waterTreatments:
  - id: filter
    hazardClass: normal
    sourceStoreId: greywater
    treatedStoreId: treated
    concentrateStoreId: concentrate
    consumableStoreId: media
    throughputKgPerS: 0.0011574074074074073
    recoveryRatio: 0.85
    removalFractions:
      dryOrganics: 0.95
    specificEnergyKWhPerKg: 0.5
    consumablePerKg: 0.01
    priority: 0

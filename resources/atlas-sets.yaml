# Which authored tileset carries the render semantics of each atlas the
# application asset manifest registers (#1014).
#
# The manifest cannot say this itself. The vendored Willpower `ImageSet`
# schema fixes the Options an `ImageSet` is allowed to carry - filtering,
# uv-style, colour-space, wrapping, mipmaps - and extending the vendored SDK
# was rejected as a much wider blast radius than the atlas work.
#
# The tileset stays the single authority for what a tile means: its render
# offset and its drawn size. This file only says
# which tileset is asked about for which atlas, and in which authored
# format that tileset is written. The install checks the declared format
# against the slot it is installing, so a mismatch is reported rather than
# silently loading the wrong shape.
#
# The render smoke module checks that every `ImageSet` in `Resources.yaml`
# is covered here, that every named tileset loads, and that it defines every
# tile the atlas declares, so the mapping cannot rot quietly.
#
# The four viewport atlases below are named without a `New` suffix: the
# #1013 transition ended when the old sheets were deleted, so the canonical
# names now resolve to the sheets sized for the 128x320 World cell. The
# three custom theme sets share the version 1 tilesets those sheets were
# authored against; see the notes on each.
#
# Paths are relative to this file.
version: 1
sets:
  SectorAtlas:
    kind: sector
    tileset: textures/sectors-new.tileset.yaml
  # The Layer-1 Sector sheet (#1086) reuses the Sector tileset unchanged. It
  # is a copy of that sheet, and render semantics - render offset, drawn
  # size - are the same for both, so a second tileset file saying the same
  # thing would be two files to keep in step for no gain. Only the pixels
  # differ, and those live in the PNG the `Image` resource names. Splitting a
  # Layer-1 tileset out is a later, local move if Layer 1 ever wants
  # semantics the Sector sheet does not have.
  SectorAtlasLayer1:
    kind: sector
    tileset: textures/sectors-new.tileset.yaml
  ObjectAtlas:
    kind: object
    tileset: textures/objects-new.tileset.yaml
  AgentAtlas:
    kind: object
    tileset: textures/agents-new.tileset.yaml
  FurnitureAtlas:
    kind: object
    tileset: textures/furniture-new.tileset.yaml
  # Custom themes, unaffiliated with either transition family. They keep the
  # version 1 tilesets: a v1 object tileset carries the v1 required-tile
  # contract, and these sheets author no render offsets or drawn sizes, so
  # there is nothing in them to move to a v2 set.
  #
  # The two object-kind sets below carry no `glass-*` tile - that name
  # arrived with the v2 sheets and the repeating glass #1079 put behind it.
  # A Window's pane under them is not left unglazed: the renderer resolves
  # the pane to `glass-<style>` and, finding no such tile, draws the
  # pane-sized `window-clear` / `-frosted` / `-tinted` art the same pane
  # drew before the repeating tile existed, stretched over the pane as one
  # quad at the extent that art was authored for. Those themes draw glass,
  # and the v1 required-tile list still names the tiles that say so (#1083).
  StationAtlas:
    kind: sector
    tileset: textures/sectors.tileset.yaml
  StationFurnitureAtlas:
    kind: object
    tileset: textures/objects.tileset.yaml
  DoctorFemale1Atlas:
    kind: object
    tileset: textures/objects.tileset.yaml
